# Docker Compose untuk SPARK-PENS Project
# Menjalankan seluruh ekosistem secara lokal: PostgreSQL + Backend + Frontend

version: "3.8"

services:
  # Database PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: spark-pens-db
    restart: always
    environment:
      POSTGRES_USER: sparkuser
      POSTGRES_PASSWORD: sparkpass123
      POSTGRES_DB: sparkpensdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed-admin.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkuser -d sparkpensdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend ASP.NET Core
  backend:
    build:
      context: ../2026-SPARK-PENS-backend
      dockerfile: Dockerfile
    container_name: spark-pens-backend
    restart: always
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=db;Database=sparkpensdb;Username=sparkuser;Password=sparkpass123;SSL Mode=Disable
      - Jwt__Key=SparkPensSecretKey12345678901234567890
      - Jwt__Issuer=SparkPens
      - Jwt__Audience=SparkPensUsers
      - FrontendUrl=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  # Frontend React (Vite)
  frontend:
    image: node:20-alpine
    container_name: spark-pens-frontend
    working_dir: /app
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_GOOGLE_CLIENT_ID=886176078344-jimop9ec8htg2cvuuijvgluuevggmlatT_ID.apps.googleusercontent.com
    volumes:
      - ../2026-SPARK-PENS-frontend:/app
    command: >
      sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

  # Nginx Reverse Proxy (Opsional)
  nginx:
    image: nginx:alpine
    container_name: spark-pens-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
    driver: local

# Networks
networks:
  default:
    name: spark-pens-network
    driver: bridge
